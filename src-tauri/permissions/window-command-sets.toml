  "allow-download-and-install-application-update",
  "allow-focus-install-wizard",
  "allow-get-agent-settings-snapshot",
  "allow-get-config",
  "allow-get-copy-agent-selection",
  "allow-get-discover-leaderboard",
  "allow-get-discover-skill-detail",
  "allow-get-github-credential-status",
  "allow-get-install-wizard-session",
  "allow-get-manage-agent-selection",
  "allow-get-proxy-settings",
  "allow-get-recovery-resource-status",
  "allow-list-environments",
  "allow-list-agents",
  "allow-list-recovery-resources",
  "allow-list-skills",
