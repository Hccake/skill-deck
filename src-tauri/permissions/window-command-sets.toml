[[set]]
identifier = "shared-business-commands"
description = "Commands shared by the main window and install wizard"
permissions = [
  "allow-acquire-selected-payloads",
  "allow-execute-lifecycle-action",
  "allow-fetch-available",
  "allow-search-discover-skills",
  "allow-get-active-mutation",
  "allow-get-install-agent-selection",
  "allow-install-skills",
  "allow-list-environment-projects",
  "allow-preview-install",
  "allow-request-cancel-active-mutation"
]

