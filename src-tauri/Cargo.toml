[package]
name = "app"
version = "1.7.1"
description = "A Tauri App"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.10.0"
tauri-plugin-os = "2"

# 类型安全绑定生成
specta = "2.0.0-rc.22"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"

# 新增依赖
serde_yaml = "0.9"
thiserror = "2"
dirs = "6"
keyring = "4.1.5"
environment-protocol = { path = "crates/environment-protocol" }
environment-engine = { path = "crates/environment-engine" }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }

# 临时目录
tempfile = "3"

# HTTP 请求
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# 递归目录遍历
walkdir = "2"

# 来源格式解析
regex = "1"
scraper = { version = "0.27", default-features = false }

# URL 解析
url = "2"

# URL 编码
urlencoding = "2"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

unicode-normalization = "0.1"
sha2 = "0.10.9"
tauri-plugin-opener = "2.5.3"
tauri-plugin-single-instance = "2"
flate2 = "1.1.9"
tar = "0.4.44"
zip = "4.6.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.10.0", features = ["test"] }
tiny_http = "0.12"

[workspace]
members = [
    "crates/environment-engine",
    "crates/environment-protocol",
    "crates/wsl-environment-worker",
]
resolver = "2"
