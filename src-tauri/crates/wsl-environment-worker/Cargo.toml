[package]
name = "wsl-environment-worker"
version = "0.0.0"
edition = "2021"
rust-version = "1.88.0"
publish = false

[dependencies]
environment-engine = { path = "../environment-engine" }
environment-protocol = { path = "../environment-protocol" }
futures-util = "0.3"
libc = "0.2"
serde = "1"
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3"
