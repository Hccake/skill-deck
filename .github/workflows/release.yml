name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v1.6.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate tag, version, commit, and changelog
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          git fetch --force --tags
          COMMIT_SHA="$(git rev-list -n 1 "$TAG")"
          VERSION="$(git show "${COMMIT_SHA}:package.json" | node -e '
            let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => {
              process.stdout.write(JSON.parse(input).version);
            });
          ')"
          EXPECTED_TAG="v${VERSION}"
          test "$TAG" = "$EXPECTED_TAG" || { echo "::error::Expected ${EXPECTED_TAG}, got ${TAG}"; exit 1; }
          test -n "$COMMIT_SHA" || { echo "::error::Tag has no commit"; exit 1; }
          git show "${COMMIT_SHA}:CHANGELOG.md" | grep -Fq "## [${VERSION}]" \
            || { echo "::error::Missing CHANGELOG entry for ${VERSION}"; exit 1; }
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "commit_sha=$COMMIT_SHA"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  quality:
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      target_sha: ${{ needs.validate.outputs.commit_sha }}

  build-artifacts:
    needs: [validate, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            args: --target aarch64-apple-darwin --bundles app
            platform_key: darwin-aarch64
          - runner: macos-latest
            args: --target x86_64-apple-darwin --bundles app
            platform_key: darwin-x86_64
          - runner: ubuntu-22.04
            args: --bundles appimage
            platform_key: linux-x86_64
          - runner: windows-latest
            args: --bundles nsis
            platform_key: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Build signed updater artifact
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
      - name: Package smoke and private metadata
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
        run: node .release-tooling/scripts/package-updater-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform_key }}
          path: release-artifact
          if-no-files-found: error

  aggregate:
    needs: [validate, build-artifacts]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: release-artifacts
      - name: Validate complete matrix and create latest.json
        run: |
          node .release-tooling/scripts/aggregate-updater-manifest.mjs \
            --input release-artifacts \
            --tag "${{ needs.validate.outputs.tag }}" \
            --commit "${{ needs.validate.outputs.commit_sha }}" \
            --repository "${{ github.repository }}" \
            --output latest.json
      - name: Inspect Release state before mutation
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft,isPrerelease,assets > release-state.json 2>/dev/null; then
            node .release-tooling/scripts/verify-release-assets.mjs \
              --mode draft \
              --release release-state.json \
              --input release-artifacts \
              --expected-prerelease "$EXPECTED_PRERELEASE"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft Release when absent
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "${{ needs.validate.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            "${PRERELEASE_ARGS[@]}" \
            --title "Skill Deck ${TAG}" \
            --generate-notes
      - name: Upload validated installers and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-artifacts -type f ! -name metadata.json | sort)
          test "${#FILES[@]}" -eq 8 || { echo "::error::Expected 8 installer/signature files"; exit 1; }
          gh release upload "$TAG" "${FILES[@]}" --clobber
      - name: Verify remote assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets > remote-assets.json
          node .release-tooling/scripts/verify-release-assets.mjs \
            --mode uploaded \
            --release remote-assets.json \
            --input release-artifacts
      - name: Upload latest.json last
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release upload "$TAG" latest.json --clobber
      - name: Verify uploaded latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified-manifest
          gh release download "$TAG" --pattern "latest.json" --dir verified-manifest
          cmp --silent latest.json verified-manifest/latest.json \
            || { echo "::error::Remote latest.json does not match the validated manifest"; exit 1; }
