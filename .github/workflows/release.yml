name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v1.6.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate tag, version, commit, and changelog
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          git fetch --force --tags
          COMMIT_SHA="$(git rev-list -n 1 "$TAG")"
          VERSION="$(git show "${COMMIT_SHA}:package.json" | node -e '
            let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => {
              process.stdout.write(JSON.parse(input).version);
            });
          ')"
          EXPECTED_TAG="v${VERSION}"
          test "$TAG" = "$EXPECTED_TAG" || { echo "::error::Expected ${EXPECTED_TAG}, got ${TAG}"; exit 1; }
          test -n "$COMMIT_SHA" || { echo "::error::Tag has no commit"; exit 1; }
          git show "${COMMIT_SHA}:CHANGELOG.md" | grep -Fq "## [${VERSION}]" \
            || { echo "::error::Missing CHANGELOG entry for ${VERSION}"; exit 1; }
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "commit_sha=$COMMIT_SHA"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  quality:
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      target_sha: ${{ needs.validate.outputs.commit_sha }}

  prepare-release:
    needs: [validate, quality]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_body: ${{ steps.notes.outputs.release_body }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Extract Release notes from changelog
        run: |
          node .release-tooling/scripts/extract-release-notes.mjs \
            --changelog CHANGELOG.md \
            --version "${{ needs.validate.outputs.version }}" \
            --output release-notes.md
      - name: Export Release notes for updater metadata
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          DELIMITER="release-notes-${RANDOM}-${RANDOM}"
          {
            echo "release_body<<${DELIMITER}"
            cat release-notes.md
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"
      - name: Inspect Release state before mutation
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets > release-state.json 2>/dev/null; then
            node .release-tooling/scripts/verify-release-assets.mjs \
              --mode draft \
              --release release-state.json \
              --tag "$TAG" \
              --expected-prerelease "$EXPECTED_PRERELEASE"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft Release when absent
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "${{ needs.validate.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            "${PRERELEASE_ARGS[@]}" \
            --title "Skill Deck ${TAG}" \
            --notes-file release-notes.md
      - name: Update existing draft Release notes
        if: steps.state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --title "Skill Deck ${TAG}" \
            --notes-file release-notes.md
      - name: Verify Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_NOTES="$(gh release view "$TAG" --json body --jq .body)"
          printf '%s\n' "$REMOTE_NOTES" > remote-release-notes.md
          cmp --silent release-notes.md remote-release-notes.md \
            || { echo "::error::Remote Release notes do not match CHANGELOG.md"; exit 1; }
      - name: Resolve and verify draft Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json databaseId,tagName,isDraft,isPrerelease,assets > release-state.json
          node .release-tooling/scripts/verify-release-assets.mjs \
            --mode draft \
            --release release-state.json \
            --tag "$TAG" \
            --expected-prerelease "$EXPECTED_PRERELEASE"
          RELEASE_ID="$(node -e "const state = require('./release-state.json'); process.stdout.write(String(state.databaseId))")"
          test -n "$RELEASE_ID" || { echo "::error::Release has no database ID"; exit 1; }
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-release:
    needs: [validate, quality, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            prerelease_args: --target aarch64-apple-darwin --bundles app,dmg
            asset_platform: macos
          - runner: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            prerelease_args: --target x86_64-apple-darwin --bundles app,dmg
            asset_platform: macos
          - runner: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            prerelease_args: --bundles appimage,deb,rpm
            asset_platform: linux
          - runner: windows-latest
            args: --bundles nsis,msi
            prerelease_args: --bundles nsis
            asset_platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: ${{ needs.prepare-release.outputs.release_body }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: false
          retryAttempts: 3
          releaseAssetNamePattern: skill-deck_[version]_${{ matrix.asset_platform }}_[arch][setup][ext]
          args: ${{ needs.validate.outputs.prerelease == 'true' && matrix.prerelease_args || matrix.args }}

  verify-release:
    needs: [validate, prepare-release, build-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Extract expected Release notes
        run: |
          node .release-tooling/scripts/extract-release-notes.mjs \
            --changelog CHANGELOG.md \
            --version "${{ needs.validate.outputs.version }}" \
            --output release-notes.md
      - name: Download updater manifest and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified-release
          gh release download "$TAG" \
            --pattern "latest.json" \
            --pattern "*.sig" \
            --dir verified-release
      - name: Verify complete Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,body,assets > release-state.json
          node .release-tooling/scripts/verify-release-assets.mjs \
            --mode complete \
            --release release-state.json \
            --manifest verified-release/latest.json \
            --signatures verified-release \
            --notes release-notes.md \
            --version "$VERSION" \
            --tag "$TAG" \
            --repository "${{ github.repository }}" \
            --expected-prerelease "$EXPECTED_PRERELEASE"
