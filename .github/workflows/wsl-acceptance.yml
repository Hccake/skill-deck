name: WSL Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-deck-wsl-acceptance
  cancel-in-progress: false

jobs:
  mutation-workflows:
    name: Real Windows and WSL mutation workflow
    runs-on: [self-hosted, Windows, skill-deck-wsl]
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
      SKILL_DECK_TEST_WSL_DISTRO: ${{ vars.SKILL_DECK_TEST_WSL_DISTRO }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Verify dedicated WSL acceptance environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          $distro = $env:SKILL_DECK_TEST_WSL_DISTRO
          if ([string]::IsNullOrWhiteSpace($distro)) {
            throw "Configure the SKILL_DECK_TEST_WSL_DISTRO repository variable for the reference distro."
          }
          "runner=$env:RUNNER_NAME" | Set-Content ci-diagnostics/wsl-preflight.txt
          "distro=$distro" | Add-Content ci-diagnostics/wsl-preflight.txt
          wsl.exe --status 2>&1 | Tee-Object -FilePath ci-diagnostics/wsl-status.txt
          if ($LASTEXITCODE -ne 0) {
            throw "WSL is not available on this acceptance runner."
          }
          $configured = @(wsl.exe --list --quiet | ForEach-Object {
            ([string]$_).Trim() -replace "`0", ""
          } | Where-Object { $_ })
          if (-not ($configured | Where-Object { $_ -ieq $distro })) {
            throw "Configured WSL acceptance distribution '$distro' is not installed."
          }
          $probe = @'
          set -eu
          test -x /bin/sh
          command -v git >/dev/null
          printf 'user=%s\nhome=%s\n' "$(id -un)" "$HOME"
          git --version
          printf 'a\0b\0' | xargs -0 -r -n1 printf '%s\n' >/dev/null
          printf 'b\0a\0' | LC_ALL=C sort -z -f >/dev/null
          test "$(printf '' | sha256sum | awk '{print $1}')" = e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          test "$(readlink -f /)" = /
          stat -Lc '%d:%i:%f:%s:%Y:%y' -- / >/dev/null
          '@
          & wsl.exe --distribution $distro --exec /bin/sh -c $probe -- 2>&1 | Tee-Object -FilePath ci-diagnostics/wsl-capability-probe.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Reference WSL distro '$distro' is missing Git, POSIX shell, or a required coreutils capability."
          }
          "features=nulSafeXargs,nulSafeSort,sha256Sum,canonicalReadlink,stableStat" | Add-Content ci-diagnostics/wsl-preflight.txt
      - name: Run real WSL acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo test --locked --manifest-path src-tauri/Cargo.toml `
            --features wsl-integration-tests `
            --test wsl_environment_integration `
            runs_full_wsl_mutation_workflow_with_complete_payloads `
            -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath ci-diagnostics/wsl-acceptance.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Upload WSL acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsl-acceptance-evidence
          path: ci-diagnostics
          if-no-files-found: error
          retention-days: 14
