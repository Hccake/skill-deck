name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - run: pnpm bindings:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  shellcheck:
    name: ShellCheck bundled WSL assets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check bundled WSL operation scripts
        run: >-
          docker run --rm
          --volume "$PWD:/work"
          --workdir /work
          --entrypoint shellcheck
          koalaman/shellcheck:v0.10.0
          -s sh src-tauri/src/environment/wsl/scripts/*.sh

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Show Rust toolchain
        run: |
          rustc -Vv
          cargo -V
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check all Rust targets
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Lint all Rust targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
