name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - run: pnpm bindings:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  shellcheck:
    name: ShellCheck bundled WSL assets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check bundled WSL operation scripts
        run: >-
          docker run --rm
          --volume "$PWD:/work"
          --workdir /work
          --entrypoint shellcheck
          koalaman/shellcheck:v0.10.0
          -s sh src-tauri/src/environment/wsl/scripts/*.sh

  rust:
    name: rust (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Capture runner diagnostics
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            rustc -Vv
            cargo -V
            git --version
            git config --show-origin --get-regexp '^protocol\..*\.allow$' || true
          } | tee ci-diagnostics/toolchain.txt
      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check 2>&1 | tee ci-diagnostics/fmt.log
      - name: Check all Rust targets
        shell: bash
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | tee ci-diagnostics/check.log
      - name: Check Windows WSL integration feature
        if: runner.os == 'Windows'
        shell: bash
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --features wsl-integration-tests 2>&1 | tee ci-diagnostics/wsl-feature-check.log
      - name: Lint all Rust targets
        shell: bash
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee ci-diagnostics/clippy.log
      - name: Run Rust tests
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee ci-diagnostics/test.log
      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-diagnostics-${{ matrix.os }}
          path: ci-diagnostics
          if-no-files-found: error
          retention-days: 7
